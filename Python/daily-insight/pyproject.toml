[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-insight"
version = "0.1.0"
description = "Daily status-page insight demo: Railengine retrieval + Railtracks agent + FastAPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rail-engine>=0.2.1",
    # Pinned to commit 4e4ed57 for the ToolUseEvaluator single-session fix
    # (https://github.com/RailtownAI/railtracks/commit/4e4ed572d76f946908bb3fd441443be8903ae8de
    # — needed because /evaluate's sample_size=1 default produces one session
    # and the released 1.4.0 ToolUseEvaluator raises ValueError on fewer than 2).
    # Swap back to "railtracks[visual]>=1.4.1" (or higher) once that release ships.
    # The #subdirectory hint is required: the railtracks repo is a monorepo
    # (packages/, pdoc/, docs/ at the root), so pip's flat-layout discovery
    # fails when pointed at the root. The actual package lives at
    # packages/railtracks/ with its own pyproject.toml + src/ layout.
    "railtracks[visual] @ git+https://github.com/RailtownAI/railtracks.git@4e4ed572d76f946908bb3fd441443be8903ae8de#subdirectory=packages/railtracks",
    "railtownai>=2.0.14",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
]

[tool.setuptools]
package-dir = { "daily_insight" = "src" }
packages = [
    "daily_insight",
    "daily_insight.agents",
    "daily_insight.config",
    "daily_insight.controllers",
    "daily_insight.models",
    "daily_insight.repositories",
    "daily_insight.services",
]
